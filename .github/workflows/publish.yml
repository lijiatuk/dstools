name: Publish

# Publish to PyPI on version tags (v*) using Trusted Publishing (OIDC).
# Prerequisite: configure the project on PyPI -> "Publishing" -> add a trusted
# publisher for this GitHub repo + workflow. No API token needed.
on:
  push:
    tags: ["v*"]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for PyPI trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build distributions
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
